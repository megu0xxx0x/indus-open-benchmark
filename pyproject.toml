[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "indus-open-benchmark"
version = "0.1.0"
description = "Rights-aware Indus corpus validation and infrastructure for future custodial evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Open Indus Benchmark contributors" },
]
keywords = ["indus", "epigraphy", "decipherment", "open-science", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["jsonschema[format]>=4.25.1,<5"]

[project.optional-dependencies]
dev = [
  "pyright==1.1.409",
  "ruff==0.15.13",
]

[project.scripts]
indusbench = "indusbench.cli:main"
indusbench-kp1979-label-detector-v2 = "indusbench.kp1979_detector_v2_worker:main"
indusbench-v3dev-mtaac = "indusbench.v3dev_cli:main"
indusbench-v4dev-mtaac = "indusbench.v4dev_cli:main"
indusbench-v5dev-mtaac = "indusbench.v5dev_cli:main"

[project.urls]
Repository = "https://github.com/megu0xxx0x/indus-open-benchmark"
Issues = "https://github.com/megu0xxx0x/indus-open-benchmark/issues"
Documentation = "https://github.com/megu0xxx0x/indus-open-benchmark#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/indusbench"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "indusbench/schemas"
"registry/research_landscape.json" = "indusbench/registry/research_landscape.json"
"registry/museum_candidates.json" = "indusbench/registry/museum_candidates.json"
"registry/quarantine.json" = "indusbench/registry/quarantine.json"
"registry/sources.json" = "indusbench/registry/sources.json"
"registry/kp1979_corpus.json" = "indusbench/registry/kp1979_corpus.json"
"registry/kp1979_page_map.json" = "indusbench/registry/kp1979_page_map.json"
"registry/kp1982_batch0.json" = "indusbench/registry/kp1982_batch0.json"
"registry/kp1982_batch0_layout_seed.json" = "indusbench/registry/kp1982_batch0_layout_seed.json"
"benchmark/development-evaluator.json" = "indusbench/benchmark/development-evaluator.json"
"benchmark/mtaac-known-script-control-v1.json" = "indusbench/benchmark/mtaac-known-script-control-v1.json"
"benchmark/mtaac-known-script-control-v2.json" = "indusbench/benchmark/mtaac-known-script-control-v2.json"
"benchmark/mtaac-v3-development-v1.json" = "indusbench/benchmark/mtaac-v3-development-v1.json"
"benchmark/mtaac-v4-development-v1.json" = "indusbench/benchmark/mtaac-v4-development-v1.json"
"benchmark/mtaac-v5-development-v1.json" = "indusbench/benchmark/mtaac-v5-development-v1.json"
"benchmark/oracc-ed3b-validation-source-v1.json" = "indusbench/benchmark/oracc-ed3b-validation-source-v1.json"

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/CITATION.cff",
  "/CHANGELOG.md",
  "/benchmark",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/DATA_POLICY.md",
  "/LICENSE",
  "/README.md",
  "/RELEASE_CHECKLIST.md",
  "/SECURITY.md",
  "/docs",
  "/examples",
  "/justfile",
  "/pyproject.toml",
  "/pyrightconfig.json",
  "/registry",
  "/schemas",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
